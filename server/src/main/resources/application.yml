spring:
  application:
    name: zhiyuan-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhiyuan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/dev}
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
zhiyuan:
  jwt-secret: ${JWT_SECRET:development-only-change-this-secret-32-bytes}
  access-minutes: 15
  refresh-days: 14
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,tauri://localhost,http://tauri.localhost}
  simulator-enabled: ${UAV_SIMULATOR_ENABLED:true}
  version: ${APP_VERSION:0.1.0}
  update-url: ${UPDATE_MANIFEST_URL:}
