%% The platform consumes every device stream and publishes commands/platform events.
{allow, {username, "zhiyuan-platform"}, all, ["zhiyuan/v1/#"]}.

%% peer_cert_as_username maps the verified client certificate CN into ${username}.
%% A device may publish only its own state and acknowledgements.
{allow, {username, {re, "^UAV-[A-Za-z0-9-]+$"}}, publish, [
  "zhiyuan/v1/uavs/${username}/telemetry",
  "zhiyuan/v1/uavs/${username}/presence",
  "zhiyuan/v1/uavs/${username}/command-acks"
]}.

%% A device only receives commands addressed to its own certificate identity.
{allow, {username, {re, "^UAV-[A-Za-z0-9-]+$"}}, subscribe, [
  "zhiyuan/v1/uavs/${username}/commands"
]}.

{deny, all}.
