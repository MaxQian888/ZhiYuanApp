name: Integration Tests

# ============================================================================
# End-to-end tests against real infrastructure
# ============================================================================
# Two levels:
#   simulator  — Playwright against the static front end, no backend
#   remote     — Playwright against the real Spring Boot API, backed by the same
#                MySQL / MQTT / ClickHouse containers developers run locally
#
# The remote job is what stops "works against the in-memory store" from passing
# for "works in production". It uses docker-compose.yml so the dependency
# versions in CI and on a laptop cannot drift apart.
#
# Needs no secrets.
# ============================================================================

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-simulator:
    name: E2E (simulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-simulator-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  e2e-remote:
    name: E2E (remote API + MySQL/MQTT/ClickHouse)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--wait` blocks until every service reports healthy, so the API never
      # starts against a half-initialised MySQL.
      - name: Start infrastructure
        run: docker compose up -d --wait mysql mqtt clickhouse

      - name: Report infrastructure state
        run: docker compose ps

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run remote E2E tests
        run: pnpm test:e2e:remote

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-remote-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
