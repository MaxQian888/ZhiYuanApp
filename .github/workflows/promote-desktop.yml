name: Promote Desktop Pilot to Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pilot version approved for stable
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Approve stable manifest
    environment: desktop-stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Download current pilot manifest
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: >-
          curl --fail --show-error --silent
          --header 'X-ZhiYuan-Update-Channel: pilot'
          "$UPDATE_BASE_URL/latest.json" --output latest.json

      - name: Validate complete signed manifest and approved version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          actual=$(node scripts/desktop-release.mjs validate-manifest latest.json)
          test "$actual" = "$EXPECTED_VERSION"

      - name: Emit byte-identical stable promotion artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-stable-manifest-${{ inputs.version }}
          path: latest.json
          retention-days: 90
          compression-level: 0
