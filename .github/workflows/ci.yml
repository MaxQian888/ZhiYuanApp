name: CI/CD Pipeline

# ============================================================================
# CI/CD Pipeline Orchestrator
# ============================================================================
# This is the main CI/CD pipeline that orchestrates smaller, modular workflows.
# Each workflow can also be run independently for better maintainability.
#
# Workflow Structure:
# ├── quality.yml     - Lint, format, types, Node dependency audit (all blocking)
# ├── test.yml        - Jest with coverage gates & Next.js build
# ├── backend.yml     - Java API, Rust desktop shell, docs site (all blocking)
# ├── integration.yml - Playwright: simulator, and remote against real services
# ├── build-tauri.yml - Tauri desktop app builds (Windows, macOS, Linux)
# ├── deploy.yml      - Deployment workflows (optional, disabled by default)
# └── release.yml     - GitHub release creation (triggered by version tags)
#
# This workflow works OUT-OF-THE-BOX without requiring any secrets.
# See CI_CD.md for detailed setup instructions for optional features.
# ============================================================================

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reusable workflows can only request permissions up to those granted here.
# test.yml needs pull-requests + checks write to publish test result comments on PRs.
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Step 1: fast, parallel gates — nothing here needs infrastructure.
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  backend:
    name: Backend & Desktop
    uses: ./.github/workflows/backend.yml

  # Step 2: integration against real services. Runs only once the cheap gates are
  # green, so a lint error never burns a container-backed job.
  integration:
    name: Integration
    needs: [quality, test]
    uses: ./.github/workflows/integration.yml

  # Step 3: desktop bundles, once everything else has passed.
  build-tauri:
    name: Build Tauri
    needs: [quality, test, backend, integration]
    uses: ./.github/workflows/build-tauri.yml
