name: Code Quality

# ============================================================================
# Code Quality & Security Checks
# ============================================================================
# ESLint, Prettier, TypeScript and the Node dependency audit.
#
# Every step here is BLOCKING. Slice 0 of the production plan converted lint and
# the dependency audits from advisory (`continue-on-error: true`) into gates —
# an advisory gate is not a gate, and the whole point of the baseline is that a
# regression cannot reach master.
#
# Needs no secrets.
# ============================================================================

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Must match packageManager in package.json. Pinning here also
          # prevents the action from auto-pulling pnpm 11, which requires
          # Node >= 22.13 and crashes on the Node 20 used below.
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: TypeScript type checking
        run: pnpm typecheck

      # Blocking. If a new advisory lands, either update within range or record an
      # explicit, reviewed exception — do not re-add continue-on-error.
      - name: Node dependency audit
        run: pnpm audit --audit-level=moderate

      - name: Check for outdated dependencies
        run: pnpm outdated
        continue-on-error: true
