name: Release

# ============================================================================
# GitHub Release Creation
# ============================================================================
# Creates an unsigned draft for engineering validation when a version tag is pushed.
# Triggers on tags matching v* (e.g., v1.0.0, v2.1.0-beta).
#
# This workflow:
# 1. Runs quality checks and tests
# 2. Creates a metadata-only draft release
# Signed operator artifacts are produced separately by desktop-release.yml.
# ============================================================================

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Reusable workflows can only request permissions up to those granted here.
# test.yml needs pull-requests + checks write; create-release needs contents write.
permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  # Run quality checks first
  quality:
    name: Quality Check
    uses: ./.github/workflows/quality.yml

  # Run tests
  test:
    name: Test Suite
    uses: ./.github/workflows/test.yml

  # Create a metadata-only draft. Attaching an unsigned installer here would make it too
  # easy to distribute the CI portability artifact as a pilot build.
  create-release:
    name: Create Release
    needs: [quality, test]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify tag and canonical version agree
        run: node scripts/desktop-release.mjs check-tag "${{ github.ref_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
