name: Build Tauri

# ============================================================================
# Tauri Desktop Application Build
# ============================================================================
# Builds the Tauri desktop application for Windows, macOS, and Linux.
# This workflow is portability validation only. Every uploaded artifact is unsigned and its
# artifact name says so. Formal signing lives exclusively in desktop-release.yml.
# ============================================================================

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Tauri App (${{ matrix.platform }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Must match packageManager in package.json. Pinning here also
          # prevents the action from auto-pulling pnpm 11, which requires
          # Node >= 22.13 and crashes on the Node 20 used below.
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: desktop-${{ matrix.target }}
          cache-on-failure: true

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: |
          pnpm tauri build --target ${{ matrix.target }}
        continue-on-error: false

      - name: Upload Linux artifacts (AppImage)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux-${{ matrix.arch }}-appimage-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Linux artifacts (deb)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux-${{ matrix.arch }}-deb-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Windows artifacts (MSI)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-windows-${{ matrix.arch }}-msi-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Windows artifacts (NSIS)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-windows-${{ matrix.arch }}-nsis-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Upload macOS artifacts (DMG)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-macos-${{ matrix.arch }}-dmg-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: warn

      - name: Upload macOS artifacts (App)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-macos-${{ matrix.arch }}-app-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          retention-days: 30
          if-no-files-found: warn
