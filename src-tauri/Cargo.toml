[package]
name = "zhiyuan-operations"
version = "0.1.0"
description = "ZhiYuan drone operations desktop application"
authors = ["ZhiYuan Operations"]
license = "MIT"
repository = "https://github.com/JethroSeung/ZhiYuan-MiniProgram"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-stronghold = "2"

[profile.dev.package.scrypt]
opt-level = 3
