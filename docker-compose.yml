####################################################################################
# 智鸢本地依赖 / ZhiYuan local dependencies
#
# CI 使用同一份文件（`docker compose up -d --wait`），本地与流水线的依赖版本一致。
# MySQL   交易事实来源（ADR 0001）
# EMQX    MQTT 5 broker，需支持共享订阅与 mTLS（ADR 0002）
# ClickHouse 遥测历史（ADR 0003）；本地用单机镜像代替 ClickHouse Cloud
####################################################################################

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhiyuan
      MYSQL_ROOT_PASSWORD: zhiyuan-dev
      MYSQL_USER: zhiyuan
      MYSQL_PASSWORD: zhiyuan-dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - zhiyuan-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pzhiyuan-dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: emqx/emqx:5.8.6
    environment:
      # Anonymous access is for local development and CI only. Production
      # authenticates devices with mTLS and restricts each one to its own topics
      # — see docs/content/docs/adr/0002-mqtt-topology.mdx.
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_NODE__COOKIE: zhiyuan-dev
    ports:
      - "1883:1883" # MQTT
      - "8883:8883" # MQTT over TLS
      - "18083:18083" # dashboard
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  mqtt-secure:
    profiles: ["security-contract"]
    image: emqx/emqx:5.8.6
    environment:
      EMQX_NODE__COOKIE: zhiyuan-mtls-contract
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE: "true"
    ports:
      - "1884:1883" # authenticated legacy listener for the in-place migration contract
      - "8884:8883" # dedicated mTLS contract listener
      - "18084:18083" # isolated dashboard for diagnostics
    volumes:
      - ./infra/mqtt/secure/base.hocon:/opt/emqx/etc/base.hocon:ro
      - ./infra/mqtt/secure/acl.conf:/opt/emqx/etc/zhiyuan-acl.conf:ro
      - ./infra/mqtt/secure/contract-legacy-users.csv:/opt/emqx/etc/zhiyuan-legacy-users.csv:ro
      - ./build/mqtt-certs:/opt/emqx/etc/certs/zhiyuan:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: zhiyuan
      CLICKHOUSE_USER: zhiyuan
      CLICKHOUSE_PASSWORD: zhiyuan-dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - zhiyuan-clickhouse:/var/lib/clickhouse
      - ./server/src/main/resources/clickhouse/schema.sql:/docker-entrypoint-initdb.d/001-telemetry-schema.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  zhiyuan-mysql:
  zhiyuan-clickhouse:
